[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "information-theory-lab"
version = "1.0.0"
description = "Reproducible experiments in information, compression, communication and estimation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Navid Bagheri-Shouraki"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<2", "scipy>=1.13,<2", "matplotlib>=3.8", "scikit-learn>=1.7,<2", "Pillow>=12.2,<13", "zstandard>=0.23,<1"]

[project.optional-dependencies]
neural = ["torch>=2.4,<3"]
images = ["torch>=2.4,<3", "torchvision>=0.19", "compressai>=1.2.8,<1.3", "scikit-image>=0.25,<0.27", "pytorch-msssim>=1,<2"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "Markdown>=3.7,<4"]
notebooks = ["nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "jupyterlab>=4"]
browser = ["playwright>=1.50"]

[project.scripts]
information-lab = "information_lab.cli:main"

[project.urls]
Repository = "https://github.com/navidbagheri7/Information-Theory"
Documentation = "https://github.com/navidbagheri7/Information-Theory#readme"
Demo = "https://navidbagheri7.github.io/Information-Theory/"
Issues = "https://github.com/navidbagheri7/Information-Theory/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
information_lab = ["default_configs/*.json", "default_configs/corpora/*.txt", "default_configs/corpora/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [".local", "legacy", "build", "assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
